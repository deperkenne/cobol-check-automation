name: COBOL Check Automation

on:
  push:
    branches: ["main"]

concurrency: 
  group: cobol-check-${{ github.ref }}
  cancel-in-progress: true      # annule l'ancien run si un nouveau push arrive

jobs:
  cobol-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-zowe-v3-lts-${{ runner.os }}-v1   # changez v1 en v2 pour vider le cache

      - name: Install Zowe CLI
        run: |
          npm install -g @zowe/cli@zowe-v3-lts --no-audit --no-fund --prefer-offline
          zowe --version

      - name: Run COBOL Check
        env:
          ZOWE_USERNAME: ${{ secrets.ZOWE_USERNAME }}
          ZOWE_PASSWORD: ${{ secrets.ZOWE_PASSWORD }}
          ZOWE_OPT_HOST: ${{ secrets.ZOWE_OPT_HOST }}
          ZOWE_OPT_PORT: ${{ secrets.ZOWE_OPT_PORT }}
          ZOWE_OPT_USER: ${{ secrets.ZOWE_USERNAME }}
          ZOWE_OPT_PASSWORD: ${{ secrets.ZOWE_PASSWORD }}
          ZOWE_OPT_REJECT_UNAUTHORIZED: ${{ secrets.ZOWE_OPT_REJECT_UNAUTHORIZED }}
        run: |
          #chmod +x .github/scripts/cbl_to_mainframe.sh
           # .github/scripts/cbl_to_mainframe.sh
          chmod +x .github/scripts/cbl_to_mainframe.sh
          sshpass -p "${{ secrets.ZOWE_PASSWORD }}" \
           ssh -o StrictHostKeyChecking=no \
            "${{ secrets.ZOWE_USERNAME }}@${{ secrets.ZOWE_OPT_HOST }}" 'sh -s' \
             < .github/scripts/cbl_to_mainframe.sh
            
